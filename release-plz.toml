[workspace]
changelog_update = true
# Publish to crates.io as part of each release (token from the
# CARGO_REGISTRY_TOKEN Actions secret). A release = version bump commit,
# tag, GitHub release, and crates.io upload.
publish = true
git_release_enable = true
# Features bump minor even while major is 0.
features_always_increment_minor = true
# The semver check compares against the published crate, so it only works
# once the first release exists on crates.io. Re-enable (delete this
# line) after the first release.
semver_check = false

[changelog]
# Keep the changelog about the crate: drop kanbus board-state commits,
# release/CI plumbing, merge back-ports and the Pudicus gate setup.
commit_parsers = [
  { message = "^[a-z]+\\((kanbus|pudicus|release|ci)\\)", skip = true },
  { message = "(?i)^(back-merge|pudicus)", skip = true },
  { message = "^(chore|ci)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = ".*", group = "Other" },
]
