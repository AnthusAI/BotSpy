name: Release

# Publish-only releases under GitFlow. The version bump is NOT made here:
# scripts/prepare-release.sh runs `release-plz update` on develop and
# commits "chore: release botspy vX" there as an ordinary commit, which
# reaches main through the develop -> main promotion PR. A push to main
# then only runs `release-plz release`: tag, crates.io publish, and
# GitHub release. This workflow never commits or pushes to any branch
# (tags are not covered by branch rulesets), which is what allows the
# pudicus-receipt-gate check to be required on main. If the version on
# main is already tagged and published, `release-plz release` does
# nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the release with release-plz release --dry-run (no tag, publish, or GitHub release)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # release-plz reads GIT_TOKEN (not GITHUB_TOKEN) for its git/forge
      # operations: pushing the tag and creating the GitHub release. CARGO_REGISTRY_TOKEN (crates.io
      # token scoped to publish-new/publish-update) authorizes the
      # `cargo publish` upload release-plz performs on each release.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install release-plz
        run: |
          curl -sSfL https://github.com/MarcoIeni/release-plz/releases/download/release-plz-v0.3.169/release-plz-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install /tmp/release-plz /usr/local/bin/release-plz
          release-plz --version

      # Non-dry-run dispatches are only meaningful on main; anything else
      # must use dry_run.
      - name: Guard dispatch ref
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Releases only run from main; dispatch on ${GITHUB_REF_NAME} requires dry_run=true."
            exit 1
          fi

      # release-plz release --dry-run runs cargo's packaging checks and
      # verifies the tag, GitHub release, and crates.io upload without
      # creating or pushing anything. The tree is clean because the bump
      # is already committed, so no local commit/reset is needed.
      - name: Dry run - release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: release-plz release --dry-run -o json

      - name: Tag, publish, and create GitHub release
        if: >-
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        run: release-plz release -o json
