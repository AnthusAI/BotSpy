name: Release

# GitFlow: releases are cut from main only. develop is the continuous-
# integration branch and must never trigger this workflow, so release-plz
# never opens release PRs against develop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR creation capability
        id: pr-permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          # release-plz must open a PR to work; GITHUB_TOKEN can be blocked
          # two ways, each with its own unlock. Run when either path is
          # available; otherwise skip cleanly instead of pushing an orphan
          # release-plz-* branch and dying with 403 on every run (47 failed
          # runs and 46 orphaned branches as of 2026-10-02).
          #
          # Path 1: a repository admin enables Settings → Actions → General
          #   → Workflow permissions → "Allow GitHub Actions to create and
          #   approve pull requests" (cannot be granted from workflow YAML).
          # Path 2: a RELEASE_PLZ_TOKEN secret holds a PAT with Contents and
          #   Pull requests write; it is not subject to that repo setting.
          if [ -n "$RELEASE_PLZ_TOKEN" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if can_approve="$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" --jq '.can_approve_pull_request_reviews')"; then
            if [ "$can_approve" != "true" ]; then
              echo "::warning::Release pipeline skipped: GITHUB_TOKEN is not permitted to create pull requests and no RELEASE_PLZ_TOKEN secret is set."
              {
                echo "## Release pipeline skipped"
                echo
                echo "release-plz cannot open its release PR. Unlock with **one** of:"
                echo
                echo "1. A repository admin enables"
                echo '   **Settings → Actions → General → Workflow permissions → "Allow GitHub Actions to create and approve pull requests"**.'
                echo "2. Add a \`RELEASE_PLZ_TOKEN\` repository secret: a PAT with Contents and Pull requests write."
                echo
                echo "After either, push to main or run this workflow manually (workflow_dispatch) to resume releases."
                echo "No crates.io token is needed: publishing is disabled (release-plz.toml \`publish = false\`)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
            else
              echo "allowed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Fail open: if the permission cannot be determined, let
            # release-plz run so a real failure surfaces instead of silently
            # skipping releases forever.
            echo "::warning::Could not verify the Actions PR-permission setting; running release-plz anyway."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pr-permission.outputs.allowed == 'true'
      - name: Run release-plz
        if: steps.pr-permission.outputs.allowed == 'true'
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          # Optional PAT override (RELEASE_PLZ_TOKEN) bypasses the repo
          # setting that blocks GITHUB_TOKEN from creating PRs; falls back
          # to the default GITHUB_TOKEN when unset.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        # Library releases only: version bumps, changelog, tags, GitHub
        # releases. crates.io publishing is disabled (release-plz.toml:
        # publish = false) and no binary artifacts are produced.