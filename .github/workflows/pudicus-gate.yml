name: Pudicus receipt gate

# Fails the PR unless every commit new to the base branch carries a valid
# Pudicus receipt (HMAC trailer) and the gitleaks re-scan is clean.
# Required status check on develop and main; see docs/pudicus.md.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pudicus-receipt-gate:
    name: pudicus-receipt-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pudicus and gitleaks (pinned versions)
        run: |
          pip install --quiet "pudicus==0.1.2"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Restore shared HMAC secret
        env:
          PUDICUS_SECRET: ${{ secrets.PUDICUS_SECRET }}
        run: |
          if [ -z "$PUDICUS_SECRET" ]; then
            echo "::error::Repository secret PUDICUS_SECRET is not set; the gate cannot verify receipts."
            exit 1
          fi
          mkdir -p ~/.config/pudicus
          printf '%s\n' "$PUDICUS_SECRET" > ~/.config/pudicus/secret
          chmod 600 ~/.config/pudicus/secret

      - name: Verify receipts and re-scan
        run: scripts/pudicus_gate.sh "${{ github.base_ref }}"