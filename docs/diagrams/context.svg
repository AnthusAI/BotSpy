ex,</tspan><tspan x="309.5" dy="16.714286">Grok Bot, Antigravity</tspan><tspan x="309.5" dy="16.714286"> </tspan><tspan x="309.5" dy="16.714286">Each agent writes its session</tspan><tspan x="309.5" dy="16.714286">data to its own local files</tspan></text></g><g class="c3RvcmU= sensitive"><g class="shape" ><path d="M 395 90 C 395 66 522 66 536 66 C 550 66 677 66 677 90 V 240 C 677 264 550 264 536 264 C 522 264 395 264 395 240 V 90 Z" stroke="#d97706" class=" fill-AA4" style="stroke-width:3;" /><path d="M 395 90 C 395 114 522 114 536 114 C 550 114 677 114 677 90" stroke="#d97706" class=" fill-AA4" style="stroke-width:3;" /></g><text x="536" y="142.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="536" dy="0">Sensitive data: BotSpy local store</tspan><tspan x="536" dy="16.833333"> </tspan><tspan x="536" dy="16.833333">~/.botspy/store.db</tspan><tspan x="536" dy="16.833333">Copies of session history:</tspan><tspan x="536" dy="16.833333">sessions, messages, parts,</tspan><tspan x="536" dy="16.833333">full-text and vector indexes</tspan></text></g><g class="KHVzZXIgLSZndDsgYm90c3B5KVswXQ=="><marker id="mk-d2-3856006136-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 255 266 L 255 410" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3856006136-3488378134)" mask="url(#d2-3856006136)" /><text x="124.5" y="329" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="124.5" dy="0">Runs commands:</tspan><tspan x="124.5" dy="17.666667">sources, sessions, show, search,</tspan><tspan x="124.5" dy="17.666667">import, doctor, snapshot, stats, watch</tspan></text></g><g class="KGJvdHNweSAtJmd0OyBhZ2VudF9kYXRhKVswXQ=="><path d="M 310 536 L 310 679.5" fill="none" class="connection stroke-B1" style="stroke-width:2;"