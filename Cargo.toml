[package]
name = "botspy"
version = "0.1.0"
edition = "2021"
description = "Pop open the conversation history of any coding agent: one adapter per agent, one normalized schema, one unified agent-session history."
license = "MIT"
repository = "https://github.com/AnthusAI/BotSpy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "bdd"
harness = false