[package]
name = "botspy"
version = "0.1.0"
edition = "2021"
description = "Pop open the conversation history of any coding agent: one adapter per agent, one normalized schema, one unified agent-session history."
license = "MIT"
repository = "https://github.com/AnthusAI/BotSpy"
readme = "README.md"
keywords = ["coding-agents", "chat-history", "sessions", "ai", "cli"]
categories = ["development-tools", "text-processing"]
# Keep the packaged crate lean for crates.io (10 MB limit): no Kanbus
# board data, no fixtures, no local tooling.
exclude = [
    "/project",
    "/.kanbus.yml",
    "/tests/fixtures",
]

[dependencies]
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "bdd"
harness = false

[[bin]]
name = "botspy"
path = "src/main.rs"